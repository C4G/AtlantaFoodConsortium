name: Build Containers

on:
  push:
    branches: ['main', 'staging']
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/c4g/atlanta-food-consortium
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Prune Package Versions
        uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: 'atlanta-food-consortium'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'false'

  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (Migrations)
        id: meta-migrations
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/c4g/atlanta-food-consortium-migrations
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push (migrations)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: migrations
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta-migrations.outputs.tags }}
          labels: ${{ steps.meta-migrations.outputs.labels }}

      - name: Prune Package Versions
        uses: actions/delete-package-versions@v5.0.0
        with:   
          package-name: 'atlanta-food-consortium-migrations'    
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: 'false'

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Staging
        if: github.ref_name == 'staging'
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            '${{ secrets.STAGING_DEPLOY_URL }}' \
            --header 'Authorization: Bearer ${{ secrets.DEPLOY_KEY }}'

      - name: Deploy Production
        if: github.ref_name == 'main'
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            '${{ secrets.PRODUCTION_DEPLOY_URL }}' \
            --header 'Authorization: Bearer ${{ secrets.DEPLOY_KEY }}'
